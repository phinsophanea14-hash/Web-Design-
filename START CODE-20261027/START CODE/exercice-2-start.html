<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
  
      .main {
        background: #25384B;
        display: flex;
        gap:1em;
        margin: 3em;
        padding: 3em;
        
      }

      .left-section {
        background: #A3CFCC;
        flex-grow: 1;
    
      
      }

      .right-section {
        background: #F7CFB6;
        display: flex;
        flex-direction: column;
        padding: 1em;
        gap: 1em;
        width: 200px;
       
      }

      .item {
        background: #86C2DE;
        height: 100px;
      }
 
    </style>
  </head>
  <body>
    <div class="main">
      <section class="left-section">box</section>
      <section class="right-section">
        <div class="item 1">box1</div>
        <div class="item 2">box2</div>
        <div class="item 3">box3</div>
      </section>
    </div>
  </body>
</html>
