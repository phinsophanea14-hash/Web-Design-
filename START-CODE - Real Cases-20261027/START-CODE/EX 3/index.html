<!DOCTYPE html>
<html>
  <head>
    <title>Flexbox Pricing Table</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Sono", sans-serif;
      }

      /* Hint: What can you do with a media query and flexbox? */
      @media (max-width: 1250px) {
      }

body {
        font-family: "Sono", sans-serif;
        background-color: #f4f6f9;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
      }

      .pricing-container {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 30px;
        max-width: 1200px;
        width: 100%;
      }

      .pricing-plan {
        background-color: #dd9fb9;
        border-radius: 12px;
        padding: 30px 20px;
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .plan-title {
        font-size: 1.5rem;
        font-weight: 700;
        color: #722323;
        margin-bottom: 10px;
      }

      .plan-price {
        font-size: 1.5rem;
        -webkit-text-stroke:1.5px;
        color: #340909;
        margin-bottom: 20px;
      }

      .plan-features {
        list-style: none;
        padding: 0;
        margin: 0 0 25px 0;
        text-align: center;
        width: 100%;
      }

      .plan-features li {
        padding: 10px 0;
        color: #302d2d;
      }

      .plan-button {
        background-color: #cd4472;
        color: white;
        border: none;
        padding: 12px 25px ;
        font-size: 1rem;
        font-family: inherit;
        font-weight: 700;
        border-radius: 6px;
        cursor: pointer;
     
      }

      .plan-button:hover {
        background-color: #5d083c;
      }

      @media (max-width: 800px) {
        .pricing-container {
          flex-direction: column; 
          align-items: stretch;
        }

        .pricing-plan {
          width: 100%;
          box-sizing: border-box;
        }
      }

    </style>
  </head>

  <body>
    <div class="pricing-container">
      <div class="pricing-plan">
        <div class="plan-title">Basic</div>
        <div class="plan-price">$9.99/month</div>
        <ul class="plan-features">
          <li>✅ 10GB Storage</li>
          <li>✅ 1 User</li>
          <li>🚫 Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
      <div class="pricing-plan">
        <div class="plan-title">Standard</div>
        <div class="plan-price">$19.99/month</div>
        <ul class="plan-features">
          <li>✅ 50GB Storage</li>
          <li>✅ 5 Users</li>
          <li>✅ Phone &amp; Email Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
      <div class="pricing-plan">
        <div class="plan-title">Premium</div>
        <div class="plan-price">$49.99/month</div>
        <ul class="plan-features">
          <li>✅ 100GB Storage</li>
          <li>✅ 10 Users</li>
          <li>✅ 24/7 Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
    </div>
  </body>
</html>
